<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/ui/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/ui/icon-192.png" />
    <meta
      name="description"
      content="Telluride Trails — a real-time 3D trail running game set in Telluride, CO and the San Juan Mountains."
    />
    <title>Telluride Trails</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d141c;
        color: #f3f5f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #ui-root > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
