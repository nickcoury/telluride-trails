<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101820" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/ui/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/ui/icon-192.png" />
    <link rel="preload" as="image" href="./title-hero.webp" type="image/webp" />
    <meta
      name="description"
      content="Telluride Trails — a real-time 3D trail running game set in Telluride, CO and the San Juan Mountains."
    />
    <title>Telluride Trails</title>
    <style>
      @layer reset {
        html,
        body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #0d141c;
          color: #f3f5f7;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
        }
        #app {
          position: relative;
          width: 100%;
          height: 100%;
        }
        #game-canvas {
          display: block;
          width: 100%;
          height: 100%;
        }
        #title-hero-backdrop {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: center 45%;
          pointer-events: none;
          z-index: 0;
          opacity: 1;
          transition: opacity 0.9s ease;
        }
        #title-hero-backdrop.is-hidden {
          opacity: 0;
        }
        #title-hero-backdrop.is-instant-hidden {
          transition: none;
          opacity: 0;
        }
        #ui-root {
          position: absolute;
          inset: 0;
          pointer-events: none;
          z-index: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <img
        id="title-hero-backdrop"
        src="./title-hero.webp"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
        decoding="async"
        onerror="this.classList.add('is-instant-hidden')"
      />
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
